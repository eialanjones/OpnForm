name: Mentorfy deploy (forms.mentorfy.io)

on:
  push:
    branches: [formsfy]
    paths:
      - "api/**"
      - "client/**"
      - "docker/**"
      - ".github/workflows/mentorfy-deploy.yml"
  workflow_dispatch:

concurrency:
  group: opnform-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/formsfy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            file: docker/Dockerfile.api
          - name: client
            file: docker/Dockerfile.client
          - name: ingress
            file: docker/Dockerfile.ingress
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: meta
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            APP_VERSION=formsfy-${{ steps.meta.outputs.short }}
          tags: |
            ghcr.io/eialanjones/opnform/${{ matrix.name }}:${{ steps.meta.outputs.short }}
            ghcr.io/eialanjones/opnform/${{ matrix.name }}:formsfy
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: false

  deploy:
    if: github.ref == 'refs/heads/formsfy'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.OPNFORM_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OPNFORM_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          printf '%s %s\n' "$GITHUB_ACTOR" "$GH_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            root@svr.mentorfy.io "deploy $GITHUB_SHA" | tee deploy.log

      - name: Summary
        if: always()
        run: |
          {
            echo '### Deploy result'
            echo '```'
            if [ -f deploy.log ]; then tail -n 5 deploy.log; else echo "no deploy output"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
