# Ingress do OpnForm no Railway.
#
# Diferenças em relação ao docker/nginx.conf (Docker Compose):
#   - upstreams vêm de env (no Compose eram nomes de container fixos)
#   - escuta em ${PORT}, que o Railway injeta
#   - fastcgi e proxy apontam para *.railway.internal
#
# Substituição feita pelo envsubst da imagem oficial do nginx. O
# NGINX_ENVSUBST_FILTER no Dockerfile limita quais variáveis são trocadas — sem
# ele, o envsubst comeria $uri, $host e $remote_addr, que são variáveis do
# próprio nginx e precisam sobreviver ao template.

map $request_uri $api_uri {
    ~^/api(/.*$) $1;
    default $request_uri;
}

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html/public;
    client_max_body_size ${NGINX_MAX_BODY_SIZE};

    access_log /dev/stdout;
    error_log /dev/stderr error;

    index index.html index.htm index.php;

    # A entrada de DNS de um serviço na rede privada do Railway só passa a
    # existir depois que ele sobe pela primeira vez. Com o host escrito
    # literalmente no proxy_pass/fastcgi_pass, o nginx resolve no boot e morre
    # com "host not found in upstream" enquanto o vizinho não estiver no ar —
    # o que faz o ingress depender da ordem de subida para conseguir iniciar.
    #
    # Passando o upstream por variável, a resolução vai para o tempo de
    # request: o ingress sobe sozinho, responde 502 enquanto o destino não
    # existe, e volta a funcionar quando ele aparece. O valid= também cobre a
    # troca de IP a cada redeploy dos outros serviços.
    #
    # NGINX_LOCAL_RESOLVERS é preenchida pelo 16-railway-resolvers.envsh que o
    # Dockerfile.ingress instala, a partir do /etc/resolv.conf do container.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    location / {
        proxy_http_version 1.1;
        set $client_upstream "${OPNFORM_CLIENT_HOST}";
        proxy_pass http://$client_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location ~/(api|open|local\/temp|forms\/assets)/ {
        set $original_uri $uri;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $api_upstream "${OPNFORM_API_HOST}";
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $api_uri;
        # O Laravel precisa saber que a ponta pública é HTTPS, senão gera
        # links http:// e o SSO quebra no redirect.
        fastcgi_param HTTPS $https_flag;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    location ~ /\. {
        deny all;
    }
}
